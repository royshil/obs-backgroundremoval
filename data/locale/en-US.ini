# Description for the Strength setting in Blur Background - Keep them clear and concise.
"How strongly the parts farthest from the focus point are blurred. 0 leaves the image sharp. The default is 4."="How strongly the parts farthest from the focus point are blurred. 0 leaves the image sharp. The default is 4."

# Description for the Focus Ratio setting in Blur Background - Keep them clear and concise.
"Where the image stays sharp: -100% keeps the person sharp, 100% keeps the background sharp, and 0% balances the two. The blur grows with the distance from there. The default is -100%."="Where the image stays sharp: -100% keeps the person sharp, 100% keeps the background sharp, and 0% balances the two. The blur grows with the distance from there. The default is -100%."

