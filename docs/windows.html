    <h1>Install on Windows</h1>

    <ol>
      <li>Download the Windows ZIP from the <a href=
      "https://github.com/royshil/obs-backgroundremoval/releases/latest" target="_blank" rel="noopener noreferrer">latest release</a>.</li>

      <li>Read the included instructions and place the plugin under
      <code>C:\ProgramData\obs-studio\plugins</code>.</li>

      <li>Restart OBS Studio.</li>
    </ol>

    <p>Do not install OBS plugins under Program Files. See the <a href="https://obsproject.com/kb/plugins-guide">OBS
    Plugins Guide</a>.</p>
