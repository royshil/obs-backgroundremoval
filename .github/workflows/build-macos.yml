name: Build (macOS)

on:
  workflow_call:
    inputs:
      attest-artifacts:
        description: Attests artifacts.
        required: true
        type: boolean
      notarize:
        description: Notarizes pkg.
        required: true
        type: boolean
      x86_64:
        description: Builds for x86_64.
        required: true
        type: boolean
        default: false
      TAHOE_DEVELOPER_DIR:
        description: Xcode developer directory for Tahoe.
        required: true
        type: string

    secrets:
      MACOS_NOTARIZATION_PASSWORD:
        required: false
      MACOS_NOTARIZATION_USERNAME:
        required: false
      MACOS_SIGNING_APPLICATION_IDENTITY:
        required: false
      MACOS_SIGNING_CERT_PASSWORD:
        required: false
      MACOS_SIGNING_CERT:
        required: false
      MACOS_SIGNING_INSTALLER_IDENTITY:
        required: false

    outputs:
      dsym-artifact:
        description: dSYM archive for macOS.
        value: ${{ jobs.tahoe.outputs.DSYM_ARTIFACT_NAME }}
      pkg-artifact:
        description: PKG artifact for macOS.
        value: ${{ jobs.tahoe.outputs.PKG_ARTIFACT_NAME }}

env:
  HOMEBREW_NO_ANALYTICS: '1'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_ENV_HINTS: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  tahoe:
    runs-on: macos-26
    timeout-minutes: 180

    outputs:
      DSYM_ARTIFACT_NAME: ${{ steps.archive-dsym.outputs.DSYM_ARTIFACT_NAME }}
      PKG_ARTIFACT_NAME: ${{ steps.package-signed.outputs.PKG_ARTIFACT_NAME || steps.package-unsigned.outputs.PKG_ARTIFACT_NAME }}

    env:
      CCACHE_ORT_DIR: .ccache_ort
      CMAKE_OSX_ARCHITECTURES: ${{ inputs.x86_64 && 'x86_64' || 'arm64' }}
      DEVELOPER_DIR: ${{ inputs.TAHOE_DEVELOPER_DIR }}
      VCPKG_ROOT: ${{ github.workspace }}/vendor/vcpkg

    steps:
      - name: Print macOS version
        id: macos-version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          printf 'MACOS_PRODUCT_VERSION=%s\n' "$(sw_vers -productVersion)" | tee -a "${GITHUB_OUTPUT:?}"

      - name: Print Xcode version
        id: xcode-version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          printf 'XCODE_VERSION=%s\n' "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" | tee -a "${GITHUB_OUTPUT:?}"
          printf 'XCODE_BUILD_VERSION=%s\n' "$(xcodebuild -version | awk 'NR == 2 { print $3 }')" | tee -a "${GITHUB_OUTPUT:?}"

      - name: Initialize JOB_TEMP (macOS)
        id: job-temp
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          JOB_TEMP="$(mktemp -d -t "${GITHUB_JOB:?}-${GITHUB_RUN_ID:?}.XXXXXXX")"
          printf 'JOB_TEMP=%s\n' "${JOB_TEMP:?}" >>"${GITHUB_OUTPUT:?}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Checkout submodules (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: git submodule update --init --filter=blob:none vendor/obs-studio vendor/vcpkg

      - name: Load buildspec.props and VERSION
        id: buildspec
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          foreach ($entry in (Get-Content -LiteralPath buildspec.props -Raw | ConvertFrom-StringData).GetEnumerator()) {
            Add-Content -Value "$($entry.Key)=$($entry.Value)" -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          }

          $PLUGIN_VERSION = (Get-Content -Raw -LiteralPath VERSION).Trim()
          "PLUGIN_VERSION=$PLUGIN_VERSION"
          Add-Content -Value "PLUGIN_VERSION=$PLUGIN_VERSION" -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      # BEGIN: Set up toolchains

      - name: Run bootstrap-vcpkg.sh
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          ENVS=(
            DEVELOPER_DIR="${DEVELOPER_DIR:?}"
            HOME="${HOME:?}"
            PATH=/usr/bin:/bin
            VCPKG_ROOT="${VCPKG_ROOT:?}"
          )
          /usr/bin/env -i "${ENVS[@]}" "${VCPKG_ROOT:?}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Fetch vcpkg tools (macOS)
        id: vcpkg-tools
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          ENVS=(
            DEVELOPER_DIR="${DEVELOPER_DIR:?}"
            HOME="${HOME:?}"
            PATH=/usr/bin:/bin
            VCPKG_ROOT="${VCPKG_ROOT:?}"
          )

          CMAKE_COMMAND="$(/usr/bin/env -i "${ENVS[@]}" "${VCPKG_ROOT:?}/vcpkg" fetch cmake | tail -n1)"
          NINJA_COMMAND="$(/usr/bin/env -i "${ENVS[@]}" "${VCPKG_ROOT:?}/vcpkg" fetch ninja | tail -n1)"

          printf 'CMAKE_COMMAND=%s\n' "${CMAKE_COMMAND:?}" | tee -a "${GITHUB_OUTPUT:?}"
          printf 'NINJA_COMMAND=%s\n' "${NINJA_COMMAND:?}" | tee -a "${GITHUB_OUTPUT:?}"

      - name: Set up buildspec dependencies (macOS)
        id: setup-buildspec-deps
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CMAKE_COMMAND: ${{ steps.vcpkg-tools.outputs.CMAKE_COMMAND }}
        run: |
          "${CMAKE_COMMAND:?}" -P scripts/download-deps.cmake

      # END: Set up toolchains

      - name: Configure obs-studio (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CMAKE_COMMAND: ${{ steps.vcpkg-tools.outputs.CMAKE_COMMAND }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ steps.buildspec.outputs.osx_deployment_target }}
          CMAKE_PREFIX_PATH: ${{ steps.setup-buildspec-deps.outputs.OBS_DEPS_PREFIX }};${{ steps.setup-buildspec-deps.outputs.OBS_DEPS_QT6_PREFIX }}
          OBS_VERSION_OVERRIDE: ${{ steps.buildspec.outputs.obs_studio_git_tag }}
        run: |
          ENVS=(
            DEVELOPER_DIR="${DEVELOPER_DIR:?}"
            HOME="${HOME:?}"
            PATH="${CMAKE_COMMAND%/*}:/usr/bin:/bin"
          )

          /usr/bin/env -i "${ENVS[@]}" \
            "${CMAKE_COMMAND:?}" \
            -S "${GITHUB_WORKSPACE:?}/vendor/obs-studio" \
            -B "${GITHUB_WORKSPACE:?}/build_obs" \
            -G Xcode \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE:?}/obs_installed" \
            -DCMAKE_OSX_ARCHITECTURES="${CMAKE_OSX_ARCHITECTURES:?}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${CMAKE_OSX_DEPLOYMENT_TARGET:?}" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:?}" \
            -DENABLE_FRONTEND=OFF \
            -DENABLE_PLUGINS=OFF \
            -DOBS_CMAKE_VERSION=3.0.0 \
            -DOBS_VERSION_OVERRIDE="${OBS_VERSION_OVERRIDE:?}"

      - name: Build obs-studio (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CMAKE_COMMAND: ${{ steps.vcpkg-tools.outputs.CMAKE_COMMAND }}
        run: |
          ENVS=(
            DEVELOPER_DIR="${DEVELOPER_DIR:?}"
            HOME="${HOME:?}"
            PATH="${CMAKE_COMMAND%/*}:/usr/bin:/bin"
          )

          /usr/bin/env -i "${ENVS[@]}" "${CMAKE_COMMAND:?}" --build build_obs --target obs-frontend-api --config Release --parallel

      - name: Install obs-studio (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CMAKE_COMMAND: ${{ steps.vcpkg-tools.outputs.CMAKE_COMMAND }}
        run: |
          "${CMAKE_COMMAND:?}" --install build_obs --component Development --config Release --prefix obs_installed

      - name: Configure (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CMAKE_COMMAND: ${{ steps.vcpkg-tools.outputs.CMAKE_COMMAND }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ steps.buildspec.outputs.osx_deployment_target }}
          CMAKE_PREFIX_PATH: ${{ steps.setup-buildspec-deps.outputs.OBS_DEPS_PREFIX }};${{ steps.setup-buildspec-deps.outputs.OBS_DEPS_QT6_PREFIX }};${{ github.workspace }}/obs_installed;${{ github.workspace }}/obs_installed/Frameworks
        run: |
          ENVS=(
            DEVELOPER_DIR="${DEVELOPER_DIR:?}"
            GITHUB_RUN_ID="${GITHUB_RUN_ID:?}"
            HOME="${HOME:?}"
            PATH="${CMAKE_COMMAND%/*}:/usr/bin:/bin"
          )

          /usr/bin/env -i "${ENVS[@]}" \
            "${CMAKE_COMMAND:?}" -S . -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="${CMAKE_OSX_ARCHITECTURES:?}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${CMAKE_OSX_DEPLOYMENT_TARGET:?}" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:?}"

      - name: Build (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CMAKE_COMMAND: ${{ steps.vcpkg-tools.outputs.CMAKE_COMMAND }}
        run: |
          ENVS=(
            DEVELOPER_DIR="${DEVELOPER_DIR:?}"
            HOME="${HOME:?}"
            PATH="${CMAKE_COMMAND%/*}:/usr/bin:/bin"
          )

          /usr/bin/env -i "${ENVS[@]}" "${CMAKE_COMMAND:?}" --build build --config RelWithDebInfo --parallel

      - name: Test (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CMAKE_COMMAND: ${{ steps.vcpkg-tools.outputs.CMAKE_COMMAND }}
        run: |
          ENVS=(
            DEVELOPER_DIR="${DEVELOPER_DIR:?}"
            HOME="${HOME:?}"
            PATH="${CMAKE_COMMAND%/*}:/usr/bin:/bin"
          )

          /usr/bin/env -i "${ENVS[@]}" "${CMAKE_COMMAND%/*}/ctest" \
            --test-dir build --build-config RelWithDebInfo --output-on-failure

      - name: Archive dSYM (macOS)
        id: archive-dsym
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          ARCH: ${{ inputs.x86_64 && 'x86_64' || 'arm64' }}
          PLUGIN_VERSION: ${{ steps.buildspec.outputs.PLUGIN_VERSION }}
        run: |
          DSYM_ARTIFACT_NAME="obs-backgroundremoval-${PLUGIN_VERSION:?}-macos-${ARCH:?}.plugin.dSYM.tar.xz"
          dsymutil build/RelWithDebInfo/obs-backgroundremoval.plugin/Contents/MacOS/obs-backgroundremoval -o obs-backgroundremoval.plugin.dSYM
          COPYFILE_DISABLE=1 tar -cJf "${DSYM_ARTIFACT_NAME:?}" --no-mac-metadata --no-xattrs obs-backgroundremoval.plugin.dSYM
          printf 'DSYM_ARTIFACT_NAME=%s\n' "${DSYM_ARTIFACT_NAME:?}" | tee -a "${GITHUB_OUTPUT:?}"

      - name: Attest dSYM artifact (macOS)
        if: inputs.attest-artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive-dsym.outputs.DSYM_ARTIFACT_NAME }}

      - name: Upload dSYM artifact (macOS)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.archive-dsym.outputs.DSYM_ARTIFACT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Set up Apple code signing
        id: setup-codesign
        if: inputs.attest-artifacts
        uses: kaito-tokyo/setup-apple-codesigning@b9f7d7c6819fe6f6bb44694b75963918dcbddd27 # v1.0.0
        with:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}

      - name: Package signed PKG (macOS)
        id: package-signed
        if: inputs.attest-artifacts
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          ARCH: ${{ inputs.x86_64 && 'x86_64' || 'arm64' }}
          BUILD_PREFIX: ${{ github.workspace }}/build_prefix
          CMAKE_COMMAND: ${{ steps.vcpkg-tools.outputs.CMAKE_COMMAND }}
          MACOS_SIGNING_APPLICATION_IDENTITY: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          MACOS_SIGNING_INSTALLER_IDENTITY: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
          PLUGIN_BUNDLE_ID: ${{ steps.buildspec.outputs.PLUGIN_BUNDLE_ID }}
          PLUGIN_VERSION: ${{ steps.buildspec.outputs.PLUGIN_VERSION }}
        run: |
          PKG_ARTIFACT_NAME="obs-backgroundremoval-${PLUGIN_VERSION:?}-macos-${ARCH:?}.pkg"

          mkdir -p build_pkg

          "${CMAKE_COMMAND:?}" --install build --config RelWithDebInfo --prefix "${BUILD_PREFIX:?}" --strip

          codesign \
            --force \
            --sign "${MACOS_SIGNING_APPLICATION_IDENTITY:?}" \
            --options runtime \
            --timestamp \
            "${BUILD_PREFIX:?}/Library/Application Support/obs-studio/plugins/obs-backgroundremoval.plugin"

          pkgbuild \
            --root "${BUILD_PREFIX:?}" \
            --identifier "${PLUGIN_BUNDLE_ID:?}" \
            --version "${PLUGIN_VERSION:?}" \
            --install-location / \
            build_pkg/component.pkg

          productbuild \
            --distribution build/Distribution \
            --package-path build_pkg \
            --resources . \
            --sign "${MACOS_SIGNING_INSTALLER_IDENTITY:?}" \
            "${PKG_ARTIFACT_NAME:?}"

          printf 'PKG_ARTIFACT_NAME=%s\n' "${PKG_ARTIFACT_NAME:?}" | tee -a "${GITHUB_OUTPUT:?}"

      - name: Attest signed PKG (macOS)
        if: inputs.attest-artifacts && !inputs.notarize
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package-signed.outputs.PKG_ARTIFACT_NAME }}

      - name: Notarize signed PKG
        if: inputs.attest-artifacts && inputs.notarize
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CODESIGN_TEAM: ${{ vars.CODESIGN_TEAM }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_USERNAME: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          PKG_ARTIFACT_NAME: ${{ steps.package-signed.outputs.PKG_ARTIFACT_NAME }}
        run: |
          xcrun notarytool submit "${PKG_ARTIFACT_NAME:?}" \
            --apple-id "${MACOS_NOTARIZATION_USERNAME:?}" \
            --password "${MACOS_NOTARIZATION_PASSWORD:?}" \
            --team-id "${CODESIGN_TEAM:?vars.CODESIGN_TEAM is not set}" \
            --wait
          xcrun stapler staple "${PKG_ARTIFACT_NAME:?}"
          xcrun stapler validate "${PKG_ARTIFACT_NAME:?}"
          spctl --assess --type install --verbose=2 "${PKG_ARTIFACT_NAME:?}"

      - name: Attest notarized PKG (macOS)
        if: inputs.attest-artifacts && inputs.notarize
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package-signed.outputs.PKG_ARTIFACT_NAME }}

      - name: Package unsigned PKG (macOS)
        id: package-unsigned
        if: ${{ !inputs.attest-artifacts }}
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          ARCH: ${{ inputs.x86_64 && 'x86_64' || 'arm64' }}
          BUILD_PREFIX: ${{ github.workspace }}/build_prefix
          CMAKE_COMMAND: ${{ steps.vcpkg-tools.outputs.CMAKE_COMMAND }}
          PLUGIN_BUNDLE_ID: ${{ steps.buildspec.outputs.PLUGIN_BUNDLE_ID }}
          PLUGIN_VERSION: ${{ steps.buildspec.outputs.PLUGIN_VERSION }}
        run: |
          PKG_ARTIFACT_NAME="obs-backgroundremoval-${PLUGIN_VERSION:?}-macos-${ARCH:?}.unsigned.pkg"

          mkdir -p build_pkg

          "${CMAKE_COMMAND:?}" --install build --config RelWithDebInfo --prefix "${BUILD_PREFIX:?}" --strip
          codesign \
            --force \
            --sign - \
            --options runtime \
            "${BUILD_PREFIX:?}/Library/Application Support/obs-studio/plugins/obs-backgroundremoval.plugin"

          pkgbuild \
            --root "${BUILD_PREFIX:?}" \
            --identifier "${PLUGIN_BUNDLE_ID:?}" \
            --version "${PLUGIN_VERSION:?}" \
            --install-location / \
            build_pkg/component.pkg

          productbuild \
            --distribution build/Distribution \
            --package-path build_pkg \
            --resources . \
            "${PKG_ARTIFACT_NAME:?}"

          printf 'PKG_ARTIFACT_NAME=%s\n' "${PKG_ARTIFACT_NAME:?}" | tee -a "${GITHUB_OUTPUT:?}"

      - name: Upload PKG artifact (macOS)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package-signed.outputs.PKG_ARTIFACT_NAME || steps.package-unsigned.outputs.PKG_ARTIFACT_NAME }}
          archive: false
          if-no-files-found: error

  test-tahoe:
    if: ${{ !inputs.x86_64 }}
    needs: tahoe
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install scenario test dependencies (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          brew install --cask obs
          xattr -dr com.apple.quarantine /Applications/OBS.app

      - name: Download PKG artifact (macOS)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.tahoe.outputs.PKG_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ github.job }}/artifact
          skip-decompress: true

      - name: Install plugin for scenario tests (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/${{ github.job }}/artifact
        run: |
          pkg_path="${ARTIFACT_DIR:?}/${{ needs.tahoe.outputs.PKG_ARTIFACT_NAME }}"
          test -f "${pkg_path}"
          installer -pkg "${pkg_path}" -target CurrentUserHomeDirectory

      - name: Run scenario tests (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          PLUGIN_BUILD_DIR: ${{ runner.temp }}/${{ github.job }}
        run: ./tests/Scenarios/+run-macos.sh run_all

      - name: Upload scenario test results (macOS)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-test-results-macos-arm64
          path: ${{ runner.temp }}/${{ github.job }}/build_test_reports
          if-no-files-found: warn
