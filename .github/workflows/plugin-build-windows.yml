# file: .github/workflows/plugin-build-windows.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# version: 1.2.0
# date: 2026-06-17

on:
  workflow_call:
    inputs:
      environment:
        description: The environment name for the build jobs, or empty string for no environment
        required: false
        type: string
        default: ''
      VCPKG_BINARY_SOURCES:
        description: VCPKG_BINARY_SOURCES environment variable for the build jobs
        required: true
        type: string

permissions: {}

jobs:
  build-windows-x64:
    # FIXME: Environments will be created later.
    # environment: ${{ inputs.environment }}
    runs-on: windows-2022
    timeout-minutes: 180

    permissions:
      contents: read

    env:
      VCPKG_BINARY_SOURCES: '${{ inputs.VCPKG_BINARY_SOURCES }}'

    steps:
      - name: Enable Windows long path
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1

      - name: Output Image Metadata
        id: image-metadata
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          echo "ImageVersion=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Extract buildspec.props
        id: buildspec
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          awk '!/(^#|^[[:space:]]*$)/' buildspec.props >> "$GITHUB_OUTPUT"

      - name: Checkout vcpkg
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.buildspec.outputs.vcpkg_default_git_tag }}
          persist-credentials: false
          path: vcpkg
          filter: blob:none

      - name: Run bootstrap-vcpkg.bat
        shell: pwsh
        env:
          VCPKG_ROOT: '${{ github.workspace }}\vcpkg'
        run: |
          & (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics

      - name: Set up Python for build requirements
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          pip-install: -r requirements-build.txt

      - name: Set up ccache
        id: setup-ccache
        uses: ./.github/actions/setup-ccache

      - name: Checkout obs-studio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: obsproject/obs-studio
          ref: ${{ steps.buildspec.outputs.obs_studio_git_tag }}
          persist-credentials: false
          path: obs-studio
          filter: blob:none

      - name: Checkout ONNX Runtime
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ steps.buildspec.outputs.onnxruntime_git_tag }}
          persist-credentials: false
          path: onnxruntime
          submodules: recursive

      - name: Build OBS (Windows)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; $ProgressPreference = 'SilentlyContinue'

          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg'

          $pwshExe = & $vcpkgExe fetch powershell-core | Select-Object -Last 1
          $cmakeExe = & $vcpkgExe fetch cmake | Select-Object -Last 1

          $path = @(
            Split-Path $pwshExe -Parent
            Split-Path $cmakeExe -Parent
            'C:\Program Files\Git\cmd',
            'C:\Windows\System32\WindowsPowerShell\v1.0',
            'C:\Windows\System32',
            'C:\Windows'
          )

          Import-Module ./scripts/BuildOBS.psm1

          $env:PATH = $path -join ';'
          $env:PLUGIN_BUILD_DIR = $env:GITHUB_WORKSPACE

          Initialize-ObsDeps -Component prebuilt
          Initialize-ObsDeps -Component qt6
          Invoke-ObsConfigure
          Invoke-ObsBuild
          Install-Obs

      - name: Install dependencies listed on vcpkg.json (x64-windows-static-md-obs)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; $ProgressPreference = 'SilentlyContinue'

          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg.exe'

          $path = @(
            'C:\Program Files\Git\cmd',
            'C:\Windows\System32\WindowsPowerShell\v1.0',
            'C:\Windows\System32',
            'C:\Windows'
          )

          $env:PATH = $path -join ';'
          $env:VCPKG_ROOT = $vcpkgRoot

          & $vcpkgExe install --triplet=x64-windows-static-md-obs --x-install-root=vcpkg_installed

      - name: Generate toolchain hash for building ONNX Runtime
        id: toolchain-hash
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          HASH: >-
            ${{ hashFiles(
              'buildspec.props',
              'scripts/BuildOnnxRuntime.psm1',
              'src/required_operators_and_types.with_runtime_opt.config',
              'scripts/ort_patches/*.patch'
            ) }}
        run: |
          printf 'HASH=%s\n' "$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore ONNX Runtime ccache generated by ORT CI (Windows x64)
        id: restore-ccache-ort
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache_ort
          key: ort-ccache-${{ runner.os }}-x64-${{ steps.image-metadata.outputs.ImageVersion }}-${{ steps.toolchain-hash.outputs.HASH }}-${{ steps.setup-ccache.outputs.VERSION }}
          restore-keys: |
            ort-ccache-${{ runner.os }}-x64-${{ steps.image-metadata.outputs.ImageVersion }}-${{ steps.toolchain-hash.outputs.HASH }}-
            ort-ccache-${{ runner.os }}-x64-${{ steps.image-metadata.outputs.ImageVersion }}-

      - name: Reset .ccache_ort stats
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CCACHE_DIR: '${{ github.workspace }}/.ccache_ort'
          CCACHE_BASEDIR: '${{ github.workspace }}'
        run: |
          ccache -z

      - name: Build ONNX Runtime (Windows)
        shell: pwsh
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; $ProgressPreference = 'SilentlyContinue'

          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg'

          $pwshExe = & $vcpkgExe fetch powershell-core | Select-Object -Last 1
          $cmakeExe = & $vcpkgExe fetch cmake | Select-Object -Last 1
          $ninjaExe = & $vcpkgExe fetch ninja | Select-Object -Last 1
          $vswhereExe = & $vcpkgExe fetch vswhere | Select-Object -Last 1
          $ccacheExe = Get-Command ccache

          $path = @(
            Split-Path $pwshExe -Parent
            Split-Path $cmakeExe -Parent
            Split-Path $ninjaExe -Parent
            Split-Path $vswhereExe -Parent
            Split-Path $ccacheExe.Source -Parent
            'C:\Program Files\Git\cmd',
            'C:\Windows\System32\WindowsPowerShell\v1.0',
            'C:\Windows\System32',
            'C:\Windows'
          )

          Import-Module ./scripts/BuildOnnxRuntime.psm1

          $env:CCACHE_DIR = '.ccache_ort'
          $env:CCACHE_BASEDIR = $env:GITHUB_WORKSPACE
          $env:CCACHE_SLOPPINESS = 'include_file_mtime,time_macros'
          $env:PATH = $path -join ';'
          $env:PLUGIN_BUILD_DIR = $env:GITHUB_WORKSPACE

          Update-OrtSourceWithPatches
          Invoke-OrtBuildPy -Command update
          Invoke-OrtBuildPy -Command build
          Install-Ort

      - name: Show .ccache_ort stats
        if: always()
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CCACHE_DIR: '${{ github.workspace }}/.ccache_ort'
          CCACHE_BASEDIR: '${{ github.workspace }}'
        run: |
          ccache -s

      - name: Configure (Windows x64)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; $ProgressPreference = 'SilentlyContinue'

          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg'

          $cmakeExe = & $vcpkgExe fetch cmake | Select-Object -Last 1
          $ninjaExe = & $vcpkgExe fetch ninja | Select-Object -Last 1

          $path = @(
            Split-Path $cmakeExe -Parent
            Split-Path $ninjaExe -Parent
            'C:\Windows\System32\WindowsPowerShell\v1.0',
            'C:\Windows\System32',
            'C:\Windows'
          )

          $env:PATH = $path -join ';'

          cmake --preset windows -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build (Windows x64)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; $ProgressPreference = 'SilentlyContinue'

          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg'

          $cmakeExe = & $vcpkgExe fetch cmake | Select-Object -Last 1
          $ninjaExe = & $vcpkgExe fetch ninja | Select-Object -Last 1

          $path = @(
            Split-Path $cmakeExe -Parent
            Split-Path $ninjaExe -Parent
            'C:\Windows\System32\WindowsPowerShell\v1.0',
            'C:\Windows\System32',
            'C:\Windows'
          )

          $env:PATH = $path -join ';'

          cmake --build --preset windows --config RelWithDebInfo

      - name: Package (Windows x64)
        shell: pwsh
        run: |
          ./scripts/package_plugin_windows.ps1

      - name: Upload Plugin Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pluginbinary-windows-x64-${{ github.run_id }}
          path: |
            release/*-windows-x64.zip
            release/*-windows-x64-pdb.zip
          if-no-files-found: error
          retention-days: 7
