name: Plugin Build Windows

# file: .github/workflows/plugin-build-windows.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-06-22

on:
  workflow_call:
    inputs:
      job-index:
        description: The job index for logging.
        required: true
        type: number
      environment:
        description: The environment name for this workflow, or empty string for no environment
        required: false
        type: string
        default: ''
      WINDOWS_SDK_VERSION:
        description: The version of Windows SDK to build with.
        required: true
        type: string
      VCPKG_VERSION:
        description: Default VCPKG_BINARY_SOURCES.
        required: true
        type: string
      OBS_VERSION:
        description: The version of OBS Studio to build.
        required: true
        type: string
      ORT_VERSION:
        description: The version of ONNX Runtime to build.
        required: true
        type: string
      VCPKG_BINARY_SOURCES:
        description: VCPKG_BINARY_SOURCES environment variable for the build jobs.
        required: true
        type: string

permissions: {}

jobs:
  build-windows-x64:
    environment: ${{ inputs.environment }}
    runs-on: windows-2022
    timeout-minutes: 180

    permissions:
      contents: read

    env:
      ORT_VERSION: ${{ inputs.ORT_VERSION }}
      OBS_VERSION: ${{ inputs.OBS_VERSION }}
      VCPKG_VERSION: ${{ inputs.VCPKG_VERSION }}
      WINDOWS_SDK_VERSION: ${{ inputs.WINDOWS_SDK_VERSION }}
      VCPKG_BINARY_SOURCES: ${{ inputs.VCPKG_BINARY_SOURCES }}

    steps:
      - name: Enable Windows long path
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1

      - name: Output Image Metadata
        id: image-metadata
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          echo "ImageVersion=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Extract buildspec.props
        id: buildspec
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          awk '!/(^#|^[[:space:]]*$)/' buildspec.props >> "$GITHUB_OUTPUT"

      - name: Set up Python for build requirements
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          pip-install: -r requirements-build.txt

      - name: Set up ccache
        id: setup-ccache
        uses: ./.github/actions/setup-ccache

      - name: Checkout vcpkg
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_VERSION }}
          persist-credentials: false
          path: vcpkg
          filter: blob:none

      - name: Assert vcpkg git commit
        shell: pwsh
        working-directory: vcpkg
        env:
          GIT_COMMIT: ${{ steps.buildspec.outputs.vcpkg_default_git_commit }}
        run: |
          $actualGitCommit = git rev-parse HEAD
          if ($actualGitCommit -ne $env:GIT_COMMIT) { throw "Git commit not match: expected $env:GIT_COMMIT, actual $actualGitCommit" }

      - name: Run bootstrap-vcpkg.bat
        shell: pwsh
        env:
          VCPKG_ROOT: '${{ github.workspace }}\vcpkg'
        run: |
          & (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics

      - name: Install dependencies listed on vcpkg.json (x64-windows-static-md-obs)
        shell: pwsh
        env:
          VCPKG_ROOT: '${{ github.workspace }}\vcpkg'
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true

          $vcpkgExe = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'

          # Set PATH
          $env:PATH = @(
              'C:\Program Files\Git\cmd',
              'C:\Windows\System32\WindowsPowerShell\v1.0',
              'C:\Windows\System32',
              'C:\Windows'
          ) -join [System.IO.Path]::PathSeparator

          & $vcpkgExe install --triplet=x64-windows-static-md-obs --x-install-root=vcpkg_installed

      - name: Checkout obs-studio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          persist-credentials: false
          path: obs-studio
          filter: blob:none

      - name: Assert obs-studio git commit
        shell: pwsh
        working-directory: obs-studio
        env:
          GIT_COMMIT: ${{ steps.buildspec.outputs.obs_studio_git_commit }}
        run: |
          $actualGitCommit = git rev-parse HEAD
          if ($actualGitCommit -ne $env:GIT_COMMIT) { throw "Git commit not match: expected $env:GIT_COMMIT, actual $actualGitCommit" }

      - name: Build OBS (Windows)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true

          Import-Module ./scripts/BuildOBS.psm1

          $vcpkgExe = Join-Path $env:GITHUB_WORKSPACE 'vcpkg' 'vcpkg'

          # Set PATH
          $env:PATH = @(
              Split-Path (& $vcpkgExe fetch cmake | Select-Object -Last 1) -Parent
              Split-Path (& $vcpkgExe fetch ninja | Select-Object -Last 1) -Parent
              Split-Path (& $vcpkgExe fetch vswhere | Select-Object -Last 1) -Parent
              'C:\Program Files\Git\cmd',
              'C:\Windows\System32\WindowsPowerShell\v1.0',
              'C:\Windows\System32',
              'C:\Windows'
          ) -join [System.IO.Path]::PathSeparator

          # Remove vcpkg variables
          $env:VCPKG_ROOT = $null
          $env:VCPKG_INSTALLATION_ROOT = $null

          # Configure GITHUB_TOKEN
          $basicToken = [System.Convert]::ToBase64String(
              [System.Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GITHUB_TOKEN")
          )

          Write-Output "::add-mask::$basicToken"

          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraHeader'
          $env:GIT_CONFIG_VALUE_0 = "Authorization: basic $basicToken"

          $env:X_VCPKG_ASSET_SOURCES = 'clear;x-script,pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/vcpkg_asset_sources.ps1 {url} {sha512} {dst}'

          # Build OBS
          Initialize-ObsDeps -Component prebuilt
          Initialize-ObsDeps -Component qt6
          Invoke-ObsConfigure
          Invoke-ObsBuild
          Install-Obs

      - name: Checkout ONNX Runtime
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ env.ORT_VERSION }}
          persist-credentials: false
          path: onnxruntime
          submodules: recursive

      - name: Assert onnxruntime git commit
        shell: pwsh
        working-directory: onnxruntime
        env:
          GIT_COMMIT: ${{ steps.buildspec.outputs.onnxruntime_git_commit }}
        run: |
          $actualGitCommit = git rev-parse HEAD
          if ($actualGitCommit -ne $env:GIT_COMMIT) { throw "Git commit not match: expected $env:GIT_COMMIT, actual $actualGitCommit" }

      - name: Generate toolchain hash for building ONNX Runtime
        id: toolchain-hash
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          HASH: >-
            ${{ hashFiles(
              'buildspec.props',
              'scripts/BuildOnnxRuntime.psm1',
              'src/required_operators_and_types.with_runtime_opt.config',
              'scripts/ort_patches/*.patch'
            ) }}
        run: |
          printf 'HASH=%s\n' "$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore ONNX Runtime ccache generated by ORT CI (Windows x64)
        id: restore-ccache-ort
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache_ort
          key: ort-ccache-${{ runner.os }}-x64-${{ steps.image-metadata.outputs.ImageVersion }}-${{ steps.toolchain-hash.outputs.HASH }}-${{ steps.setup-ccache.outputs.VERSION }}
          restore-keys: |
            ort-ccache-${{ runner.os }}-x64-${{ steps.image-metadata.outputs.ImageVersion }}-${{ steps.toolchain-hash.outputs.HASH }}-
            ort-ccache-${{ runner.os }}-x64-${{ steps.image-metadata.outputs.ImageVersion }}-

      - name: Reset .ccache_ort stats
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CCACHE_DIR: '${{ github.workspace }}/.ccache_ort'
          CCACHE_BASEDIR: '${{ github.workspace }}'
        run: |
          ccache -z

      - name: Build ONNX Runtime (Windows)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true

          Import-Module ./scripts/BuildOnnxRuntime.psm1

          $vcpkgExe = Join-Path $env:GITHUB_WORKSPACE 'vcpkg' 'vcpkg'

          # Configure ccache
          $env:CCACHE_DIR = Join-Path $env:GITHUB_WORKSPACE '.ccache_ort'
          $env:CCACHE_BASEDIR = $env:GITHUB_WORKSPACE
          $env:CCACHE_SLOPPINESS = 'include_file_mtime,time_macros'

          # Set PATH
          $env:PATH = @(
              Split-Path (& $vcpkgExe fetch powershell-core | Select-Object -Last 1) -Parent
              Split-Path (Get-OrtToolchain -Name cmake) -Parent
              Split-Path (Get-OrtToolchain -Name ninja) -Parent
              Split-Path (Get-OrtToolchain -Name vswhere) -Parent
              Split-Path (Get-Command ccache).Source -Parent
              'C:\Program Files\Git\cmd',
              'C:\Windows\System32\WindowsPowerShell\v1.0',
              'C:\Windows\System32',
              'C:\Windows'
          ) -join [System.IO.Path]::PathSeparator

          # Remove vcpkg variables
          $env:VCPKG_ROOT = $null
          $env:VCPKG_INSTALLATION_ROOT = $null

          # Configure GITHUB_TOKEN
          $basicToken = [System.Convert]::ToBase64String(
              [System.Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GITHUB_TOKEN")
          )

          Write-Output "::add-mask::$basicToken"

          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraHeader'
          $env:GIT_CONFIG_VALUE_0 = "Authorization: basic $basicToken"

          $env:X_VCPKG_ASSET_SOURCES = 'clear;x-script,pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/vcpkg_asset_sources.ps1 {url} {sha512} {dst}'

          # Build ONNX Runtime
          Update-OrtSourceWithPatches -OrtVersion $env:ORT_VERSION
          Invoke-OrtBuildPy -Command update -WindowsSdkVersion $env:WINDOWS_SDK_VERSION
          Invoke-OrtBuildPy -Command build -WindowsSdkVersion $env:WINDOWS_SDK_VERSION
          Install-Ort

      - name: Show .ccache_ort stats
        if: always()
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CCACHE_DIR: '${{ github.workspace }}/.ccache_ort'
          CCACHE_BASEDIR: '${{ github.workspace }}'
        run: |
          ccache -s

      - name: Configure (Windows x64)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; $ProgressPreference = 'SilentlyContinue'

          $vcpkgExe = Join-Path $env:GITHUB_WORKSPACE 'vcpkg' 'vcpkg'

          # Set PATH
          $env:PATH = @(
              Split-Path (& $vcpkgExe fetch cmake | Select-Object -Last 1) -Parent
              Split-Path (& $vcpkgExe fetch ninja | Select-Object -Last 1) -Parent
              Split-Path (& $vcpkgExe fetch vswhere | Select-Object -Last 1) -Parent
              'C:\Program Files\Git\cmd',
              'C:\Windows\System32\WindowsPowerShell\v1.0',
              'C:\Windows\System32',
              'C:\Windows'
          ) -join [System.IO.Path]::PathSeparator

          cmake --preset windows -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build (Windows x64)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true

          $vcpkgExe = Join-Path $env:GITHUB_WORKSPACE 'vcpkg' 'vcpkg'

          # Set PATH
          $env:PATH = @(
              Split-Path (& $vcpkgExe fetch cmake | Select-Object -Last 1) -Parent
              Split-Path (& $vcpkgExe fetch ninja | Select-Object -Last 1) -Parent
              Split-Path (& $vcpkgExe fetch vswhere | Select-Object -Last 1) -Parent
              'C:\Program Files\Git\cmd',
              'C:\Windows\System32\WindowsPowerShell\v1.0',
              'C:\Windows\System32',
              'C:\Windows'
          ) -join [System.IO.Path]::PathSeparator

          cmake --build --preset windows --config RelWithDebInfo

      - name: Package (Windows x64)
        shell: pwsh
        run: |
          ./scripts/package_plugin_windows.ps1

      - name: Upload Plugin Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pluginbinary-windows-x64-${{ github.run_id }}
          path: |
            release/*-windows-x64.zip
            release/*-windows-x64-pdb.zip
          if-no-files-found: error
          retention-days: 7
