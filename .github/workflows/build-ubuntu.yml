name: Build (Ubuntu)

on:
  workflow_call:
    inputs:
      attest-artifacts:
        description: Attests artifacts.
        required: true
        type: boolean
      arm64:
        description: Builds for arm64.
        required: true
        type: boolean
      release-build:
        description: Builds a release.
        required: true
        type: boolean
      PACKAGE_VERSION_SUFFIX_RESOLUTE:
        description: Version suffix for resolute.
        required: false
        type: string
        default: '-1~resolute1'
    outputs:
      resolute-deb-artifact:
        description: Binary package for Ubuntu Resolute.
        value: ${{ jobs.resolute.outputs.DEB_ARTIFACT_NAME }}
      resolute-ddeb-artifact:
        description: Debug symbols for Ubuntu Resolute.
        value: ${{ jobs.resolute.outputs.DDEB_ARTIFACT_NAME }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  resolute:
    runs-on: ${{ inputs.arm64 && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 180

    environment: ${{ inputs.release-build && 'release-linux' || null }}

    outputs:
      DEB_ARTIFACT_NAME: ${{ steps.artifact-names.outputs.DEB_ARTIFACT_NAME }}
      DDEB_ARTIFACT_NAME: ${{ steps.artifact-names.outputs.DDEB_ARTIFACT_NAME }}

    env:
      PACKAGE_VERSION_SUFFIX: ${{ inputs.PACKAGE_VERSION_SUFFIX_RESOLUTE }}

    steps:
      - name: Install dependencies (Ubuntu)
        shell: /usr/bin/bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          sudo apt-get update && sudo apt-get -y --no-install-recommends install \
            build-essential \
            ca-certificates \
            cmake \
            file \
            git \
            libcurl4-openssl-dev \
            libobs-dev \
            libonnxruntime-dev \
            libopencv-dev \
            qt6-base-dev \
            uuid-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Print artifact names (Ubuntu)
        id: artifact-names
        shell: /usr/bin/bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          ARCH: ${{ inputs.arm64 && 'arm64' || 'amd64' }}
        run: |
          PLUGIN_VERSION="$(cat VERSION)"
          PACKAGE_FILE_VERSION="${PLUGIN_VERSION:?}${PACKAGE_VERSION_SUFFIX//[~+]/.}"
          DEB_ARTIFACT_NAME="obs-backgroundremoval_${PACKAGE_FILE_VERSION:?}_${ARCH:?}.deb"
          printf 'DEB_ARTIFACT_NAME=%s\n' "${DEB_ARTIFACT_NAME:?}" | tee -a "${GITHUB_OUTPUT:?}"
          printf 'DDEB_ARTIFACT_NAME=%s\n' "${DEB_ARTIFACT_NAME%.deb}-dbgsym.ddeb" | tee -a "${GITHUB_OUTPUT:?}"

      - name: Configure (Ubuntu)
        shell: /usr/bin/bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          cmake -S "${GITHUB_WORKSPACE:?}" -B build \
            "-DCMAKE_BUILD_TYPE=RelWithDebInfo" \
            "-DCMAKE_INSTALL_PREFIX=/usr" \
            "-DCPACK_GENERATOR=DEB" \
            "-DCPACK_DEBIAN_FILE_NAME=${{ steps.artifact-names.outputs.DEB_ARTIFACT_NAME }}" \
            "-DPACKAGE_VERSION_SUFFIX=${PACKAGE_VERSION_SUFFIX:?}"

      - name: Build (Ubuntu)
        shell: /usr/bin/bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test (Ubuntu)
        shell: /usr/bin/bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

      - name: Package deb and ddeb artifacts (Ubuntu)
        shell: /usr/bin/bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: cmake --build build --config RelWithDebInfo --target package

      - name: Attest package artifacts (Ubuntu)
        if: inputs.attest-artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/${{ steps.artifact-names.outputs.DEB_ARTIFACT_NAME }}
            build/${{ steps.artifact-names.outputs.DDEB_ARTIFACT_NAME }}

      - name: Upload deb artifact (Ubuntu)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/${{ steps.artifact-names.outputs.DEB_ARTIFACT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Upload ddeb artifact (Ubuntu)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/${{ steps.artifact-names.outputs.DDEB_ARTIFACT_NAME }}
          archive: false
          if-no-files-found: error

  test-resolute:
    needs: resolute
    runs-on: ${{ inputs.arm64 && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 30

    steps:
      - name: Install scenario test dependencies (Ubuntu)
        shell: /usr/bin/bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install \
            at-spi2-core \
            ca-certificates \
            dbus-daemon \
            dbus-x11 \
            ffmpeg \
            git \
            obs-studio \
            python3-pyatspi \
            xauth \
            xvfb

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download deb artifact (Ubuntu)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolute.outputs.DEB_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ github.job }}
          skip-decompress: true

      - name: Install deb artifact (Ubuntu)
        shell: /usr/bin/bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          PACKAGE_FILE: ${{ runner.temp }}/${{ github.job }}/${{ needs.resolute.outputs.DEB_ARTIFACT_NAME }}
        run: sudo apt-get -y install "${PACKAGE_FILE:?}"

      - name: Run scenario tests (Ubuntu)
        shell: /usr/bin/bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: ./tests/Scenarios/+run-debian.sh run_all

      - name: Upload scenario test artifacts (Ubuntu)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-test-results-ubuntu-resolute-${{ inputs.arm64 && 'arm64' || 'amd64' }}
          path: ${{ github.workspace }}/build_test_reports
          if-no-files-found: warn
