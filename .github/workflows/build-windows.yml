name: Build (Windows)

on:
  workflow_call:
    inputs:
      attest-artifacts:
        description: Attests artifacts.
        required: true
        type: boolean
      runs-on:
        description: GitHub Actions runner label.
        required: true
        type: string
    outputs:
      zip-artifact:
        description: ZIP artifact for Windows.
        value: ${{ jobs.build.outputs.ZIP_ARTIFACT_NAME }}
      pdb-artifact:
        description: PDB artifact for Windows.
        value: ${{ jobs.build.outputs.PDB_ARTIFACT_NAME }}

env:
  # https://github.com/kaito-tokyo/vcpkg-obs-kaito-tokyo
  VCPKG_BINARY_SOURCES: clear;http,https://vcpkg-obs.kaito.tokyo/{sha},read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 180

    outputs:
      ZIP_ARTIFACT_NAME: ${{ steps.package-zip.outputs.ZIP_ARTIFACT_NAME }}
      PDB_ARTIFACT_NAME: ${{ steps.package-pdb.outputs.PDB_ARTIFACT_NAME }}

    env:
      CCACHE_ORT_DIR: .ccache_ort
      VCPKG_FORCE_DOWNLOADED_BINARIES: '1'
      VCPKG_ORT_TARGET_TRIPLET: x64-windows-static-md-obs-ort
      VCPKG_ROOT: ${{ github.workspace }}/vendor/vcpkg
      VCPKG_TARGET_TRIPLET: x64-windows-static-md-obs

    steps:
      - name: Enable Windows long paths
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: Set-ItemProperty -LiteralPath 'HKLM:\System\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1

      - name: Print Windows build version
        id: windows-build
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $WINDOWS_BUILD_VERSION = [Environment]::OSVersion.Version.Build
          "WINDOWS_BUILD_VERSION=$WINDOWS_BUILD_VERSION"
          Add-Content -Value "WINDOWS_BUILD_VERSION=$WINDOWS_BUILD_VERSION" -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Checkout submodules
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: git submodule update --init --filter=blob:none vendor/obs-studio vendor/vcpkg vendor/onnxruntime

      - name: Load buildspec.props and VERSION
        id: buildspec
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          foreach ($entry in (Get-Content -LiteralPath buildspec.props -Raw | ConvertFrom-StringData).GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)"
            Add-Content -Value "$($entry.Key)=$($entry.Value)" -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          }

          $PLUGIN_VERSION = (Get-Content -Raw -LiteralPath VERSION).Trim()
          "PLUGIN_VERSION=$PLUGIN_VERSION"
          Add-Content -Value "PLUGIN_VERSION=$PLUGIN_VERSION" -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      # BEGIN: Set up toolchains

      - name: Run bootstrap-vcpkg.bat
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $BOOTSTRAP_VCPKG_BAT = Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat'
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'
          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          & $BOOTSTRAP_VCPKG_BAT -disableMetrics

      - name: Set up buildspec dependencies (Windows)
        id: setup-buildspec-deps
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'
          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cmake -P scripts/download-deps.cmake

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'

      # END: Set up toolchains

      - name: Configure OBS Studio (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          CMAKE_PREFIX_PATH: ${{ steps.setup-buildspec-deps.outputs.OBS_DEPS_PREFIX }};${{ steps.setup-buildspec-deps.outputs.OBS_DEPS_QT6_PREFIX }}
          CMAKE_SYSTEM_VERSION: ${{ steps.buildspec.outputs.windows_sdk_version }}
          OBS_VERSION_OVERRIDE: ${{ steps.buildspec.outputs.obs_studio_git_tag }}
        run: |
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'
          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cmake -S vendor/obs-studio -B build_obs -G 'Visual Studio 18 2026' -A x64 `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_INSTALL_PREFIX=$(Join-Path $env:GITHUB_WORKSPACE 'obs_installed')" `
            "-DCMAKE_PREFIX_PATH=$env:CMAKE_PREFIX_PATH" `
            "-DCMAKE_SYSTEM_VERSION=$env:CMAKE_SYSTEM_VERSION" `
            "-DENABLE_FRONTEND=OFF" `
            "-DENABLE_PLUGINS=OFF" `
            "-DOBS_CMAKE_VERSION=3.0.0" `
            "-DOBS_VERSION_OVERRIDE=$env:OBS_VERSION_OVERRIDE"

      - name: Build OBS Studio (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'
          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cmake --build build_obs --target obs-frontend-api --config Release --parallel

      - name: Install OBS Studio (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'
          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cmake --install build_obs --component Development --config Release --prefix obs_installed

      - name: Install vcpkg dependencies (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $VCPKG_COMMAND = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'

          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $env:VCPKG_DISABLE_METRICS = '1'
          $env:VCPKG_FORCE_DOWNLOADED_BINARIES = '1'
          & $VCPKG_COMMAND install --triplet $env:VCPKG_TARGET_TRIPLET

      - name: Install vcpkg_ort dependencies (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'
          $VCPKG_COMMAND = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'

          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $env:VCPKG_DISABLE_METRICS = '1'
          $env:VCPKG_FORCE_DOWNLOADED_BINARIES = '1'
          & $VCPKG_COMMAND install `
            --triplet $env:VCPKG_ORT_TARGET_TRIPLET `
            --overlay-triplets (Join-Path $env:GITHUB_WORKSPACE 'vcpkg-triplets') `
            --x-install-root (Join-Path $env:GITHUB_WORKSPACE 'vcpkg_ort_installed') `
            --x-manifest-root (Join-Path $env:GITHUB_WORKSPACE 'vendor' 'onnxruntime' 'cmake')

      - name: Restore ccache_ort (Windows)
        id: ccache-ort
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_ORT_DIR }}
          key: ccache_ort-v2-${{ runner.os }}-x64-${{ steps.windows-build.outputs.WINDOWS_BUILD_VERSION }}-${{ steps.setup-buildspec-deps.outputs.CCACHE_VERSION }}-${{ steps.buildspec.outputs.windows_sdk_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache_ort-v2-${{ runner.os }}-x64-${{ steps.windows-build.outputs.WINDOWS_BUILD_VERSION }}-${{ steps.setup-buildspec-deps.outputs.CCACHE_VERSION }}-${{ steps.buildspec.outputs.windows_sdk_version }}-${{ github.run_id }}-
            ccache_ort-v2-${{ runner.os }}-x64-${{ steps.windows-build.outputs.WINDOWS_BUILD_VERSION }}-${{ steps.setup-buildspec-deps.outputs.CCACHE_VERSION }}-${{ steps.buildspec.outputs.windows_sdk_version }}-

      - name: Reset ccache_ort stats
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          CCACHE_COMMAND: ${{ steps.setup-buildspec-deps.outputs.CCACHE_COMMAND }}
        run: |
          & $env:CCACHE_COMMAND --zero-stats

      - name: Configure ONNX Runtime (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          CCACHE_COMMAND: ${{ steps.setup-buildspec-deps.outputs.CCACHE_COMMAND }}
          CMAKE_SYSTEM_VERSION: ${{ steps.buildspec.outputs.windows_sdk_version }}
          PYTHON_COMMAND: ${{ steps.setup-python.outputs.python-path }}
        run: |
          $CMAKE_TOOLCHAIN_FILE = Join-Path $env:VCPKG_ROOT 'scripts' 'buildsystems' 'vcpkg.cmake'
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'
          $VCPKG_COMMAND = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'

          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          $env:VCPKG_DISABLE_METRICS = '1'
          $env:VCPKG_FORCE_DOWNLOADED_BINARIES = '1'
          $CMAKE_BINDIR = & $VCPKG_COMMAND fetch cmake | Select-Object -Last 1 | Split-Path -Parent
          $NINJA_BINDIR = & $VCPKG_COMMAND fetch ninja | Select-Object -Last 1 | Split-Path -Parent

          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:Path = "$CMAKE_BINDIR;$NINJA_BINDIR;$env:Path"

          $env:CCACHE_BASEDIR = $env:GITHUB_WORKSPACE
          $env:CCACHE_DIR = Join-Path $env:GITHUB_WORKSPACE $env:CCACHE_ORT_DIR
          $env:CCACHE_SLOPPINESS = 'include_file_mtime,time_macros'
          cmake -S vendor/onnxruntime/cmake -B build_ort -G Ninja --compile-no-warning-as-error `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_C_COMPILER_LAUNCHER=$env:CCACHE_COMMAND" `
            "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:CCACHE_COMMAND" `
            "-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON" `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            "-DCMAKE_SYSTEM_VERSION=$env:CMAKE_SYSTEM_VERSION" `
            "-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE" `
            "-DPython_EXECUTABLE=$env:PYTHON_COMMAND" `
            "-DVCPKG_INSTALLED_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'vcpkg_ort_installed')" `
            "-DVCPKG_MANIFEST_INSTALL=OFF" `
            "-DVCPKG_OVERLAY_TRIPLETS=$(Join-Path $env:GITHUB_WORKSPACE 'vcpkg-triplets')" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_ORT_TARGET_TRIPLET" `
            "-Donnxruntime_BUILD_SHARED_LIB=OFF" `
            "-Donnxruntime_BUILD_UNIT_TESTS=OFF" `
            "-Donnxruntime_DISABLE_RTTI=OFF" `
            "-Donnxruntime_RUN_ONNX_TESTS=OFF" `
            "-Donnxruntime_USE_VCPKG=ON"

      - name: Build ONNX Runtime (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'
          $VCPKG_COMMAND = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'

          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          $env:VCPKG_DISABLE_METRICS = '1'
          $env:VCPKG_FORCE_DOWNLOADED_BINARIES = '1'
          $CMAKE_BINDIR = & $VCPKG_COMMAND fetch cmake | Select-Object -Last 1 | Split-Path -Parent
          $NINJA_BINDIR = & $VCPKG_COMMAND fetch ninja | Select-Object -Last 1 | Split-Path -Parent

          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:Path = "$CMAKE_BINDIR;$NINJA_BINDIR;$env:Path"

          $env:CCACHE_BASEDIR = $env:GITHUB_WORKSPACE
          $env:CCACHE_DIR = Join-Path $env:GITHUB_WORKSPACE $env:CCACHE_ORT_DIR
          $env:CCACHE_SLOPPINESS = 'include_file_mtime,time_macros'
          cmake --build build_ort --config Release --parallel

      - name: Install ONNX Runtime (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $VCPKG_COMMAND = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          $env:VCPKG_DISABLE_METRICS = '1'
          $env:VCPKG_FORCE_DOWNLOADED_BINARIES = '1'
          $CMAKE_BINDIR = & $VCPKG_COMMAND fetch cmake | Select-Object -Last 1 | Split-Path -Parent
          $env:Path = "$CMAKE_BINDIR;$env:Path"

          cmake --install build_ort --config Release --prefix ort_installed

      - name: Save ccache_ort
        if: success() && steps.ccache-ort.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_ORT_DIR }}
          key: ${{ steps.ccache-ort.outputs.cache-primary-key }}

      - name: Show ccache_ort stats
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          CCACHE_COMMAND: ${{ steps.setup-buildspec-deps.outputs.CCACHE_COMMAND }}
        run: |
          & $env:CCACHE_COMMAND --show-stats | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Configure (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          CMAKE_PREFIX_PATH: ${{ steps.setup-buildspec-deps.outputs.OBS_DEPS_PREFIX }};${{ steps.setup-buildspec-deps.outputs.OBS_DEPS_QT6_PREFIX }};${{ github.workspace }}\obs_installed;${{ github.workspace }}\vcpkg_ort_installed\${{ env.VCPKG_ORT_TARGET_TRIPLET }};${{ github.workspace }}\ort_installed;${{ github.workspace }}\vcpkg_installed\${{ env.VCPKG_TARGET_TRIPLET }}
          CMAKE_SYSTEM_VERSION: ${{ steps.buildspec.outputs.windows_sdk_version }}
        run: |
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'
          $VCPKG_COMMAND = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'

          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          $env:VCPKG_DISABLE_METRICS = '1'
          $env:VCPKG_FORCE_DOWNLOADED_BINARIES = '1'
          $CMAKE_BINDIR = & $VCPKG_COMMAND fetch cmake | Select-Object -Last 1 | Split-Path -Parent
          $NINJA_BINDIR = & $VCPKG_COMMAND fetch ninja | Select-Object -Last 1 | Split-Path -Parent

          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:Path = "$CMAKE_BINDIR;$NINJA_BINDIR;$env:Path"

          cmake -S . -B build -G Ninja `
            "-DCMAKE_BUILD_TYPE=RelWithDebInfo" `
            "-DCMAKE_PREFIX_PATH=$env:CMAKE_PREFIX_PATH" `
            "-DCMAKE_SYSTEM_VERSION=$env:CMAKE_SYSTEM_VERSION"

      - name: Build (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $LAUNCH_DEVSHELL = Join-Path (vswhere -version '[18,19)' -property installationPath) 'Common7' 'Tools' 'Launch-VsDevShell.ps1'
          $VCPKG_COMMAND = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'

          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          $env:VCPKG_DISABLE_METRICS = '1'
          $env:VCPKG_FORCE_DOWNLOADED_BINARIES = '1'
          $CMAKE_BINDIR = & $VCPKG_COMMAND fetch cmake | Select-Object -Last 1 | Split-Path -Parent
          $NINJA_BINDIR = & $VCPKG_COMMAND fetch ninja | Select-Object -Last 1 | Split-Path -Parent

          & $LAUNCH_DEVSHELL -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:Path = "$CMAKE_BINDIR;$NINJA_BINDIR;$env:Path"

          cmake --build build --config RelWithDebInfo --parallel

      - name: Package ZIP artifact (Windows)
        id: package-zip
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          PLUGIN_VERSION: ${{ steps.buildspec.outputs.PLUGIN_VERSION }}
        run: |
          $ZIP_ARTIFACT_NAME = "obs-backgroundremoval-$($env:PLUGIN_VERSION)-windows-x64.zip"
          $VCPKG_COMMAND = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          $env:Path = 'C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          $env:VCPKG_DISABLE_METRICS = '1'
          $env:VCPKG_FORCE_DOWNLOADED_BINARIES = '1'
          $CMAKE_BINDIR = & $VCPKG_COMMAND fetch cmake | Select-Object -Last 1 | Split-Path -Parent
          $env:Path = "$CMAKE_BINDIR;$env:Path"

          cmake --install build --config RelWithDebInfo --prefix build_package/obs-studio/plugins
          Copy-Item -Path 'docs\windows\INSTALL.html' -Destination build_package -Force

          if (-not (Test-Path 'build_package\INSTALL.html')) {
            throw 'INSTALL.html is missing from the Windows package.'
          }
          if (-not (Test-Path 'build_package\obs-studio\plugins\obs-backgroundremoval\bin\64bit\obs-backgroundremoval.dll')) {
            throw 'obs-backgroundremoval.dll is missing from the Windows package.'
          }

          Set-Location 'build_package'
          Compress-Archive -Path '*' -DestinationPath (Join-Path $env:GITHUB_WORKSPACE $ZIP_ARTIFACT_NAME)
          Add-Content -Value "ZIP_ARTIFACT_NAME=$ZIP_ARTIFACT_NAME" -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Package PDB artifact (Windows)
        id: package-pdb
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          PLUGIN_VERSION: ${{ steps.buildspec.outputs.PLUGIN_VERSION }}
        run: |
          $PDB_ARTIFACT_NAME = "obs-backgroundremoval-$($env:PLUGIN_VERSION)-windows-x64-pdb.7z"
          $DLL_FILES = @(Get-ChildItem -LiteralPath build -Filter 'obs-backgroundremoval.dll' -File -Recurse)
          if ($DLL_FILES.Count -ne 1) {
            throw "Expected exactly one obs-backgroundremoval.dll, found $($DLL_FILES.Count)."
          }
          $PDB_PATH = [System.IO.Path]::ChangeExtension($DLL_FILES[0].FullName, '.pdb')
          if (-not (Test-Path -LiteralPath $PDB_PATH -PathType Leaf)) {
            throw "The linker PDB was not found next to the plugin DLL: $PDB_PATH"
          }

          $SEVEN_ZIP = (Get-Command 7z.exe -ErrorAction Stop).Source
          $PDB_ARCHIVE = Join-Path $env:GITHUB_WORKSPACE $PDB_ARTIFACT_NAME
          & $SEVEN_ZIP a -t7z -mx=9 $PDB_ARCHIVE $PDB_PATH
          if ($LASTEXITCODE -ne 0) { throw 'PDB compression failed.' }

          & $SEVEN_ZIP t $PDB_ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw 'PDB archive validation failed.' }
          Add-Content -Value "PDB_ARTIFACT_NAME=$PDB_ARTIFACT_NAME" -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Attest ZIP artifact
        if: inputs.attest-artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package-zip.outputs.ZIP_ARTIFACT_NAME }}

      - name: Attest PDB artifact
        if: inputs.attest-artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package-pdb.outputs.PDB_ARTIFACT_NAME }}

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package-zip.outputs.ZIP_ARTIFACT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Upload PDB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package-pdb.outputs.PDB_ARTIFACT_NAME }}
          archive: false
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install scenario test dependencies (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $buildspec = Get-Content -LiteralPath buildspec.props -Raw | ConvertFrom-StringData
          $archive = Join-Path $env:RUNNER_TEMP 'obs-studio-windows-x64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'obs-studio-windows-x64'
          Invoke-WebRequest -Uri $buildspec.obs_studio_windows_x64_url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualHash -ne $buildspec.obs_studio_windows_x64_sha256) {
            throw "OBS Studio archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination

          $obsExecutable = Get-ChildItem -LiteralPath $destination -Filter obs64.exe -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]64bit[\\/]obs64\.exe$' } |
            Select-Object -First 1
          if (-not $obsExecutable) {
            throw 'obs64.exe was not found in the official OBS Studio archive.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GUI_SCENARIO_OBS_EXECUTABLE=$($obsExecutable.FullName)" -Encoding utf8

      - name: Download ZIP artifact (Windows)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.ZIP_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ github.job }}/plugin
          skip-decompress: true

      - name: Run scenario tests (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $PACKAGE_DOWNLOAD = '${{ runner.temp }}/${{ github.job }}/plugin'
          $PACKAGE_ZIP = Get-ChildItem -LiteralPath $PACKAGE_DOWNLOAD -Filter '*.zip' -File | Select-Object -First 1
          if (-not $PACKAGE_ZIP) { throw 'The Windows plugin ZIP was not found.' }

          $PACKAGE_ROOT = '${{ runner.temp }}/${{ github.job }}/plugin-extracted'
          Expand-Archive -LiteralPath $PACKAGE_ZIP.FullName -DestinationPath $PACKAGE_ROOT
          $PLUGIN_ROOT = Join-Path $PACKAGE_ROOT 'obs-studio\plugins\obs-backgroundremoval'
          if (-not (Test-Path $PLUGIN_ROOT)) { throw "The plugin directory was not found in the ZIP: $PLUGIN_ROOT" }

          ./tests/Scenarios/+run-windows.ps1 -PluginRoot $PLUGIN_ROOT

      - name: Upload scenario test artifacts (Windows)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-test-results-windows-x64
          path: artifacts/scenario-tests/windows
          if-no-files-found: warn
