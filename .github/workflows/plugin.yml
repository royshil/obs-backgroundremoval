name: Plugin CI

# file: .github/workflows/plugin.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-05-28

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-config:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-config.yml

  build-windows:
    needs: ci-config
    permissions:
      contents: read
    uses: ./.github/workflows/plugin-build-windows.yml
    with:
      job-index: 0
      WINDOWS_SDK_VERSION: ${{ needs.ci-config.outputs.WINDOWS_SDK_VERSION }}
      VCPKG_VERSION: ${{ needs.ci-config.outputs.VCPKG_VERSION }}
      OBS_VERSION: ${{ needs.ci-config.outputs.OBS_VERSION }}
      ORT_VERSION: ${{ needs.ci-config.outputs.ORT_VERSION }}
      VCPKG_BINARY_SOURCES: ${{ needs.ci-config.outputs.VCPKG_BINARY_SOURCES }}

  build-macos:
    needs: ci-config
    permissions:
      contents: read
    uses: ./.github/workflows/plugin-build-macos.yml
    with:
      job-index: 0
      runs-on: macos-15
      DEVELOPER_DIR: /Applications/Xcode_16.4.app
      OSX_DEPLOYMENT_TARGET: ${{ needs.ci-config.outputs.OSX_DEPLOYMENT_TARGET }}
      VCPKG_VERSION: ${{ needs.ci-config.outputs.VCPKG_VERSION }}
      OBS_VERSION: ${{ needs.ci-config.outputs.OBS_VERSION }}
      ORT_VERSION: ${{ needs.ci-config.outputs.ORT_VERSION }}
      VCPKG_BINARY_SOURCES: ${{ needs.ci-config.outputs.VCPKG_BINARY_SOURCES }}
    secrets: inherit

  # build-ubuntu:
  #   needs: config
  #   permissions:
  #     contents: read
  #   uses: ./.github/workflows/plugin-build-ubuntu.yml
  #   with:
  #     VCPKG_BINARY_SOURCES: ${{ needs.config.outputs.VCPKG_BINARY_SOURCES }}
  #     vcpkg-version: ${{ needs.config.outputs.VCPKG_VERSION }}
  #     ort-version: ${{ needs.config.outputs.ORT_VERSION }}

  accept-plugin:
    name: Accept Plugin CI
    needs: [build-macos]
    # needs: [build-windows, build-macos, build-ubuntu]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Accept plugin
        run: |
          echo 'The workflow plugin has completed successfully.'

