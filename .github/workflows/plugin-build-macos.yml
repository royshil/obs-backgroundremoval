# file: .github/workflows/plugin-build-macos.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-05-28

name: Plugin build macOS

on:
  workflow_call:
    inputs:
      job-index:
        description: The job index for logging.
        required: true
        type: number
      environment:
        description: The environment name for this workflow, or empty string for no environment
        required: false
        type: string
        default: ''
      runs-on:
        description: The runner label to run this workflow on.
        required: true
        type: string
      DEVELOPER_DIR:
        description: The value of DEVELOPER_DIR environment variable.
        required: true
        type: string
      OSX_DEPLOYMENT_TARGET:
        description: The deployment target of macOS.
        required: true
        type: string
      VCPKG_VERSION:
        description: Default VCPKG_BINARY_SOURCES.
        required: true
        type: string
      OBS_VERSION:
        description: The version of OBS Studio to build.
        required: true
        type: string
      ORT_VERSION:
        description: The version of ONNX Runtime to build.
        required: true
        type: string
      VCPKG_BINARY_SOURCES:
        description: VCPKG_BINARY_SOURCES environment variable for the build jobs.
        required: true
        type: string

    secrets:
      MACOS_NOTARIZATION_PASSWORD:
        required: false
      MACOS_NOTARIZATION_USERNAME:
        required: false
      MACOS_SIGNING_APPLICATION_IDENTITY:
        required: false
      MACOS_SIGNING_CERT_PASSWORD:
        required: false
      MACOS_SIGNING_CERT:
        required: false
      MACOS_SIGNING_INSTALLER_IDENTITY:
        required: false

permissions: {}

jobs:
  build-macos:
    environment: ${{ inputs.environment }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 180

    permissions:
      contents: read

    env:
      DEVELOPER_DIR: '${{ inputs.DEVELOPER_DIR }}'
      OSX_ARCHITECTURES: 'arm64;x86_64'
      OSX_DEPLOYMENT_TARGET: ${{ inputs.OSX_DEPLOYMENT_TARGET }}
      VCPKG_VERSION: ${{ inputs.VCPKG_VERSION }}
      OBS_VERSION: ${{ inputs.OBS_VERSION }}
      ORT_VERSION: ${{ inputs.ORT_VERSION }}
      VCPKG_BINARY_SOURCES: '${{ inputs.VCPKG_BINARY_SOURCES }}'

    steps:
      - name: Output Image Metadata
        id: image-metadata
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          echo "ImageVersion=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Print Xcode version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild -version

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Extract buildspec.props
        id: buildspec
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          awk '!/(^#|^[[:space:]]*$)/' buildspec.props >> "$GITHUB_OUTPUT"

      - name: Checkout vcpkg
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.buildspec.outputs.vcpkg_default_git_tag }}
          persist-credentials: false
          path: vcpkg
          filter: blob:none

      - name: Run bootstrap-vcpkg.sh
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Set up Python for build requirements
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          pip-install: -r requirements-build.txt

      - name: Set up ccache
        id: setup-ccache
        uses: ./.github/actions/setup-ccache

      - name: Checkout obs-studio
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: obsproject/obs-studio
          ref: ${{ steps.buildspec.outputs.obs_studio_git_tag }}
          persist-credentials: false
          path: obs-studio
          filter: blob:none

      - name: Checkout ONNX Runtime
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/onnxruntime
          ref: ${{ steps.buildspec.outputs.onnxruntime_git_tag }}
          persist-credentials: false
          path: onnxruntime
          submodules: recursive

      - name: Build OBS (macOS)
        id: build-obs
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          VCPKG_ROOT: '${{ github.workspace }}/vcpkg'
        run: |
          PWSH_EXE="$("$VCPKG_ROOT/vcpkg" fetch powershell-core | tail -n1)"
          CMAKE_EXE="$("$VCPKG_ROOT/vcpkg" fetch cmake | tail -n1)"

          pwsh() {
            env -i \
              DEVELOPER_DIR="$DEVELOPER_DIR" \
              HOME="$HOME" \
              PATH="${PWSH_EXE%/*}:${CMAKE_EXE%/*}:/usr/bin:/bin:/usr/sbin:/sbin" \
              PLUGIN_BUILD_DIR="$GITHUB_WORKSPACE" \
              "$PWSH_EXE" "$@"
          }

          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOBS.psm1; Initialize-ObsDeps -Component prebuilt"
          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOBS.psm1; Initialize-ObsDeps -Component qt6"
          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOBS.psm1; Invoke-ObsConfigure"
          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOBS.psm1; Invoke-ObsBuild" | tee build_obs_release.log | xcbeautify
          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOBS.psm1; Install-Obs"

      - name: Upload OBS build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Build OBS logs
          path: |
            build_obs*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Install dependencies listed on vcpkg.json (arm64-osx-obs)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          VCPKG_ROOT: '${{ github.workspace }}/vcpkg'
        run: |
          vcpkg() {
            env -i \
              DEVELOPER_DIR="$DEVELOPER_DIR" \
              HOME="$HOME" \
              PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              VCPKG_BINARY_SOURCES="$VCPKG_BINARY_SOURCES" \
              VCPKG_ROOT="$VCPKG_ROOT" \
              "$VCPKG_ROOT/vcpkg" "$@"
          }

          vcpkg install --triplet=arm64-osx-obs --x-install-root=vcpkg_arm64_installed

      - name: Install dependencies listed on vcpkg.json (x64-osx-obs)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          VCPKG_ROOT: '${{ github.workspace }}/vcpkg'
        run: |
          vcpkg() {
            env -i \
              DEVELOPER_DIR="$DEVELOPER_DIR" \
              HOME="$HOME" \
              PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              VCPKG_BINARY_SOURCES="$VCPKG_BINARY_SOURCES" \
              VCPKG_ROOT="$VCPKG_ROOT" \
              "$VCPKG_ROOT/vcpkg" "$@"
          }

          vcpkg install --triplet=x64-osx-obs --x-install-root=vcpkg_x64_installed

      - name: Lipo vcpkg_installed
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          ./scripts/lipo_vcpkg_macos.sh \
            ./vcpkg_installed/universal-osx-obs \
            ./vcpkg_arm64_installed/arm64-osx-obs \
            ./vcpkg_x64_installed/x64-osx-obs

      - name: Generate toolchain hash for building ONNX Runtime
        id: toolchain-hash
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          HASH: >-
            ${{ hashFiles(
              'buildspec.props',
              'scripts/BuildOnnxRuntime.psm1',
              'src/required_operators_and_types.with_runtime_opt.config',
              'scripts/ort_patches/*.patch'
            ) }}
        run: |
          printf 'HASH=%s\n' "$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore ONNX Runtime ccache (macOS)
        id: restore-ccache-ort
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache_ort
          key: ccache-ort-${{ runner.os }}-universal-${{ steps.image-metadata.outputs.ImageVersion }}-${{ steps.toolchain-hash.outputs.HASH }}-${{ steps.setup-ccache.outputs.VERSION }}
          restore-keys: |
            ccache-ort-${{ runner.os }}-universal-${{ steps.image-metadata.outputs.ImageVersion }}-${{ steps.toolchain-hash.outputs.HASH }}-
            ccache-ort-${{ runner.os }}-universal-${{ steps.image-metadata.outputs.ImageVersion }}-
            ccache-ort-${{ runner.os }}-universal-

      - name: Reset .ccache_ort stats
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CCACHE_DIR: '${{ github.workspace }}/.ccache_ort'
          CCACHE_BASEDIR: '${{ github.workspace }}'
        run: |
          ccache -z

      - name: Build ONNX Runtime (macOS)
        id: build-onnxruntime
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          PYTHON: '${{ steps.setup-python.outputs.python-path }}'
          VCPKG_ROOT: '${{ github.workspace }}/vcpkg'
        run: |
          PWSH_EXE="$("$VCPKG_ROOT/vcpkg" fetch powershell-core | tail -n1)"
          CMAKE_EXE="$("$VCPKG_ROOT/vcpkg" fetch cmake | tail -n1)"
          NINJA_EXE="$("$VCPKG_ROOT/vcpkg" fetch ninja | tail -n1)"
          CCACHE_EXE="$(command -v ccache)"

          pwsh() {
            env -i \
              CCACHE_DIR="$GITHUB_WORKSPACE/.ccache_ort" \
              CCACHE_BASEDIR="$GITHUB_WORKSPACE" \
              CCACHE_SLOPPINESS='include_file_mtime,time_macros' \
              DEVELOPER_DIR="$DEVELOPER_DIR" \
              HOME="$HOME" \
              PATH="${CMAKE_EXE%/*}:${NINJA_EXE%/*}:${CCACHE_EXE%/*}:/usr/bin:/bin:/usr/sbin:/sbin" \
              PLUGIN_BUILD_DIR="$GITHUB_WORKSPACE" \
              PYTHON="$PYTHON" \
              VCPKG_BINARY_SOURCES="$VCPKG_BINARY_SOURCES" \
              "$PWSH_EXE" "$@"
          }

          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOnnxRuntime.psm1 && Update-OrtSourceWithPatches -OrtVersion '$ORT_VERSION'"
          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOnnxRuntime.psm1 && Invoke-OrtBuildPy -Command update -OsxArchitectures arm64 -OsxDeploymentTarget '$OSX_DEPLOYMENT_TARGET'"
          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOnnxRuntime.psm1 && Invoke-OrtBuildPy -Command update -OsxArchitectures x86_64 -OsxDeploymentTarget '$OSX_DEPLOYMENT_TARGET'"
          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOnnxRuntime.psm1 && Invoke-OrtBuildPy -Command build -OsxArchitectures arm64 -OsxDeploymentTarget '$OSX_DEPLOYMENT_TARGET'" | tee build_onnxruntime_arm64.log | xcbeautify
          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOnnxRuntime.psm1 && Invoke-OrtBuildPy -Command build -OsxArchitectures x86_64 -OsxDeploymentTarget '$OSX_DEPLOYMENT_TARGET'" | tee build_onnxruntime_x86_64.log | xcbeautify
          pwsh -NoProfile -Command "Import-Module ./scripts/BuildOnnxRuntime.psm1 && Install-Ort"

          ./scripts/lipo_vcpkg_macos.sh \
            vcpkg_ort_installed/universal-osx \
            build_ort_arm64/Release/vcpkg_installed/arm64-osx \
            build_ort_x86_64/Release/vcpkg_installed/x64-osx

      - name: Upload ONNX Runtime build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Build ONNX Runtime logs
          path: |
            build_onnxruntime_*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Show .ccache_ort stats
        if: always()
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CCACHE_DIR: '${{ github.workspace }}/.ccache_ort'
          CCACHE_BASEDIR: '${{ github.workspace }}'
        run: |
          ccache -s

      - name: Build Plugin (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          VCPKG_ROOT: '${{ github.workspace }}/vcpkg'
        run: |
          CMAKE_EXE="$("$VCPKG_ROOT/vcpkg" fetch cmake | tail -n1)"

          cmake() {
            env -i \
              DEVELOPER_DIR="$DEVELOPER_DIR" \
              HOME="$HOME" \
              PATH="${CMAKE_EXE%/*}:/usr/bin:/bin:/usr/sbin:/sbin" \
              "$CMAKE_EXE" "$@"
          }

          cmake --preset macos -G Xcode -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build --preset macos --config RelWithDebInfo | tee build_plugin_macos.log | xcbeautify

      - name: Upload Plugin build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Build Plugin logs
          path: |
            build_plugin_*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Plugin (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          cmake --install build --config RelWithDebInfo --strip --prefix build_stage

      - name: Extract dSYM
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          mkdir -p release
          . ./build/cmake_export.sh

          dsymutil "build/RelWithDebInfo/$PLUGIN_NAME.plugin/Contents/MacOS/$PLUGIN_NAME" -o "build/$PLUGIN_NAME.dSYM"
          ZSTD_CLEVEL=19 tar -acf "release/$PLUGIN_NAME.dSYM.tar.zst" --mac-metadata "build/$PLUGIN_NAME.dSYM"

      - name: Set up macOS Signing Certificates
        if: inputs.environment == 'production-macos'
        id: codesign
        uses: ./.github/actions/setup-macos-codesigning
        with:
          MACOS_SIGNING_APPLICATION_IDENTITY: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}

      - name: Package Plugin (macOS)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CODESIGN_ENABLED: "${{ inputs.environment == 'production-macos' }}"
          MACOS_SIGNING_APPLICATION_IDENTITY: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          MACOS_SIGNING_INSTALLER_IDENTITY: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
        run: |
          mkdir -p release
          . ./build/cmake_export.sh

          PLUGIN_BUNDLE="build_stage/Library/Application Support/obs-studio/plugins/$PLUGIN_NAME.plugin"

          if [[ "$CODESIGN_ENABLED" == true ]]; then
            codesign -s "$MACOS_SIGNING_APPLICATION_IDENTITY" -f --deep --options runtime --timestamp "$PLUGIN_BUNDLE"
          fi

          pkgbuild \
            --root build_stage \
            --identifier "$PLUGIN_BUNDLE_ID" \
            --version "$PLUGIN_VERSION" \
            --install-location / \
            build/component.pkg

          if [[ "$CODESIGN_ENABLED" == true ]]; then
            productbuild \
              --distribution build/Distribution \
              --package-path build \
              --resources . \
              --sign "$MACOS_SIGNING_INSTALLER_IDENTITY" \
              "release/$PLUGIN_NAME-$PLUGIN_VERSION-macos-universal.pkg"
          else
            productbuild \
              --distribution build/Distribution \
              --package-path build \
              --resources . \
              "release/$PLUGIN_NAME-$PLUGIN_VERSION-macos-universal.pkg"
          fi

      - name: Notarize Installer
        if: inputs.environment == 'production-macos'
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          CODESIGN_TEAM: '${{ steps.codesign.outputs.CODESIGN_TEAM }}'
          MACOS_NOTARIZATION_PASSWORD: '${{ secrets.MACOS_NOTARIZATION_PASSWORD }}'
          MACOS_NOTARIZATION_USERNAME: '${{ secrets.MACOS_NOTARIZATION_USERNAME }}'
        run: |
          . ./build/cmake_export.sh

          xcrun notarytool submit "release/$PLUGIN_NAME-$PLUGIN_VERSION-macos-universal.pkg" \
            --apple-id "$MACOS_NOTARIZATION_USERNAME" \
            --password "$MACOS_NOTARIZATION_PASSWORD" \
            --team-id "$CODESIGN_TEAM" \
            --wait

          xcrun stapler staple "release/$PLUGIN_NAME-$PLUGIN_VERSION-macos-universal.pkg"

      - name: Upload Plugin Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pluginbinary-${{ runner.os }}-universal-${{ github.run_id }}
          path: |
            release/*.pkg
            release/*.dSYM.tar.zst
          if-no-files-found: error
          retention-days: 7
