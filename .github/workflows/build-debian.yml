name: Build (Debian)

on:
  workflow_call:
    inputs:
      attest-artifacts:
        description: Attests artifacts.
        required: true
        type: boolean
      arm64:
        description: Builds for arm64.
        required: true
        type: boolean
      PACKAGE_VERSION_SUFFIX_FORKY:
        description: Version suffix for forky.
        required: false
        type: string
        default: '-1~forky1'
    outputs:
      forky-deb-artifact:
        description: Binary package for Debian Forky.
        value: ${{ jobs.forky.outputs.DEB_ARTIFACT_NAME }}
      forky-ddeb-artifact:
        description: Debug symbols for Debian Forky.
        value: ${{ jobs.forky.outputs.DDEB_ARTIFACT_NAME }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  forky:
    runs-on: ${{ inputs.arm64 && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    container: debian:forky-20260803

    outputs:
      DEB_ARTIFACT_NAME: obs-backgroundremoval_${{ steps.buildspec.outputs.PLUGIN_VERSION }}${{ inputs.PACKAGE_VERSION_SUFFIX_FORKY }}_${{ inputs.arm64 && 'arm64' || 'amd64' }}.deb
      DDEB_ARTIFACT_NAME: obs-backgroundremoval-dbgsym_${{ steps.buildspec.outputs.PLUGIN_VERSION }}${{ inputs.PACKAGE_VERSION_SUFFIX_FORKY }}_${{ inputs.arm64 && 'arm64' || 'amd64' }}.ddeb

    env:
      PACKAGE_VERSION_SUFFIX: ${{ inputs.PACKAGE_VERSION_SUFFIX_FORKY }}

    steps:
      - name: Prepare runner image (Debian)
        shell: /bin/sh -eu {0}
        run: useradd -m -U runner

      - name: Install dependencies (Debian)
        shell: /bin/sh -eu {0}
        run: |
          apt-get update && apt-get -y --no-install-recommends install \
            build-essential \
            ca-certificates \
            cmake \
            file \
            git \
            libcurl4-openssl-dev \
            libobs-dev \
            libonnxruntime-dev \
            libopencv-dev \
            qt6-base-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load VERSION
        id: buildspec
        shell: /bin/sh -eu {0}
        run: printf 'PLUGIN_VERSION=%s\n' "$(cat VERSION)" | tee -a "${GITHUB_OUTPUT:?}"

      - name: Configure (Debian)
        shell: /usr/sbin/runuser -u runner -- /bin/sh -eu {0}
        working-directory: /home/runner
        run: |
          cmake -S "${GITHUB_WORKSPACE:?}" -B build \
            "-DCMAKE_BUILD_TYPE=RelWithDebInfo" \
            "-DCMAKE_INSTALL_PREFIX=/usr" \
            "-DCPACK_GENERATOR=DEB" \
            "-DPACKAGE_VERSION_SUFFIX=${PACKAGE_VERSION_SUFFIX:?}"

      - name: Build (Debian)
        shell: /usr/sbin/runuser -u runner -- /bin/sh -eu {0}
        working-directory: /home/runner
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test (Debian)
        shell: /usr/sbin/runuser -u runner -- /bin/sh -eu {0}
        working-directory: /home/runner
        run: ctest --test-dir build --output-on-failure

      - name: Package deb and ddeb artifacts (Debian)
        shell: /usr/sbin/runuser -u runner -- /bin/sh -eu {0}
        working-directory: /home/runner
        run: cmake --build build --config RelWithDebInfo --target package

      - name: Attest deb and ddeb artifacts (Debian)
        if: inputs.attest-artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            /home/runner/build/obs-backgroundremoval_${{ steps.buildspec.outputs.PLUGIN_VERSION }}${{ inputs.PACKAGE_VERSION_SUFFIX_FORKY }}_${{ inputs.arm64 && 'arm64' || 'amd64' }}.deb
            /home/runner/build/obs-backgroundremoval-dbgsym_${{ steps.buildspec.outputs.PLUGIN_VERSION }}${{ inputs.PACKAGE_VERSION_SUFFIX_FORKY }}_${{ inputs.arm64 && 'arm64' || 'amd64' }}.ddeb

      - name: Upload deb artifact (Debian)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: /home/runner/build/obs-backgroundremoval_${{ steps.buildspec.outputs.PLUGIN_VERSION }}${{ inputs.PACKAGE_VERSION_SUFFIX_FORKY }}_${{ inputs.arm64 && 'arm64' || 'amd64' }}.deb
          archive: false
          if-no-files-found: error

      - name: Upload ddeb artifact (Debian)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: /home/runner/build/obs-backgroundremoval-dbgsym_${{ steps.buildspec.outputs.PLUGIN_VERSION }}${{ inputs.PACKAGE_VERSION_SUFFIX_FORKY }}_${{ inputs.arm64 && 'arm64' || 'amd64' }}.ddeb
          archive: false
          if-no-files-found: error

  test-forky:
    needs: forky
    runs-on: ${{ inputs.arm64 && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    container: debian:forky-20260803

    steps:
      - name: Prepare runner image (Debian)
        shell: /bin/sh -eu {0}
        run: useradd -m -U runner

      - name: Install scenario test dependencies (Debian)
        shell: /bin/sh -eu {0}
        run: |
          apt-get update && apt-get -y --no-install-recommends install \
            at-spi2-core \
            ca-certificates \
            dbus-daemon \
            dbus-x11 \
            ffmpeg \
            git \
            obs-studio \
            python3-pyatspi \
            xauth \
            xvfb

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Chown workspace to runner (Debian)
        shell: /bin/sh -eu {0}
        run: chown -R runner:runner "${GITHUB_WORKSPACE:?}"

      - name: Download deb artifact (Debian)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.forky.outputs.DEB_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ github.job }}
          skip-decompress: true

      - name: Install deb artifact (Debian)
        shell: /bin/sh -eu {0}
        env:
          PACKAGE_FILE: ${{ runner.temp }}/${{ github.job }}/${{ needs.forky.outputs.DEB_ARTIFACT_NAME }}
        run: apt-get -y install "${PACKAGE_FILE:?}"

      - name: Run scenario tests (Debian)
        shell: /usr/sbin/runuser -u runner -- /bin/sh -eu {0}
        run: ./tests/Scenarios/+run-debian.sh run_all

      - name: Upload scenario test artifacts (Debian)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-test-results-debian-forky-${{ inputs.arm64 && 'arm64' || 'amd64' }}
          path: ${{ github.workspace }}/build_test_reports
          if-no-files-found: warn
