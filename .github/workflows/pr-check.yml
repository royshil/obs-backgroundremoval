name: PR Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin-macos:
    uses: ./.github/workflows/build-plugin-macos.yml
    with:
      runs-on: macos-15
      DEVELOPER_DIR: /Applications/Xcode_16.4.app
      osx-deploy-target: '12.0'
      upload-artifacts: false

  build-plugin-macos-x86_64:
    uses: ./.github/workflows/build-plugin-macos.yml
    with:
      runs-on: macos-15
      DEVELOPER_DIR: /Applications/Xcode_16.4.app
      osx-deploy-target: '12.0'
      upload-artifacts: false
      x86_64: true
