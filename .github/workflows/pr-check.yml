name: PR Check

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read
    with:
      upload-artifacts: ${{ contains(github.event.pull_request.labels.*.name, 'upload-artifacts') }}
      attest-artifacts: false
      runs-on: windows-2022
      windows-sdk-version: '10.0.22621'

  build-macos-arm64:
    uses: ./.github/workflows/build-macos.yml
    permissions:
      contents: read
    with:
      upload-artifacts: ${{ contains(github.event.pull_request.labels.*.name, 'upload-artifacts') }}
      attest-artifacts: false
      notarize: false
      x86_64: false
      runs-on: macos-15
      DEVELOPER_DIR: /Applications/Xcode_16.4.app
      osx-deploy-target: '12.0'

  build-macos-x86_64:
    uses: ./.github/workflows/build-macos.yml
    permissions:
      contents: read
    with:
      upload-artifacts: ${{ contains(github.event.pull_request.labels.*.name, 'upload-artifacts') }}
      attest-artifacts: false
      notarize: false
      x86_64: true
      runs-on: macos-15
      DEVELOPER_DIR: /Applications/Xcode_16.4.app
      osx-deploy-target: '12.0'

  build-debian-amd64:
    uses: ./.github/workflows/build-debian.yml
    permissions:
      contents: read
    with:
      upload-artifacts: ${{ contains(github.event.pull_request.labels.*.name, 'upload-artifacts') }}
      attest-artifacts: false
      arm64: false

  build-debian-arm64:
    uses: ./.github/workflows/build-debian.yml
    permissions:
      contents: read
    with:
      upload-artifacts: ${{ contains(github.event.pull_request.labels.*.name, 'upload-artifacts') }}
      attest-artifacts: false
      arm64: true

  build-ubuntu-amd64:
    uses: ./.github/workflows/build-ubuntu.yml
    permissions:
      contents: read
    with:
      upload-artifacts: ${{ contains(github.event.pull_request.labels.*.name, 'upload-artifacts') }}
      attest-artifacts: false
      arm64: false

  build-ubuntu-arm64:
    uses: ./.github/workflows/build-ubuntu.yml
    permissions:
      contents: read
    with:
      upload-artifacts: ${{ contains(github.event.pull_request.labels.*.name, 'upload-artifacts') }}
      attest-artifacts: false
      arm64: true

  build-arch:
    uses: ./.github/workflows/build-arch.yml
    permissions:
      contents: read
