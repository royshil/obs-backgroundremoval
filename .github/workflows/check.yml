name: Check CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-clang-format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check with clang-format
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: bin/check clang-format

  check-gersemi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install check requirements
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: python -m pip install 'gersemi==0.27.7'

      - name: Check with gersemi
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: bin/check gersemi

  check-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install check requirements
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: python -m pip install 'reuse[charset-normalizer]==6.2.0'

      - name: Lint with REUSE
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: bin/check reuse

  accept-check:
    if: always()
    needs:
      - check-clang-format
      - check-gersemi
      - check-reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check workflow results
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          [[ '${{ needs.check-clang-format.result }}' == 'success' ]] &&
          [[ '${{ needs.check-gersemi.result }}' == 'success' ]] &&
          [[ '${{ needs.check-reuse.result }}' == 'success' ]] &&
          printf 'OK\n'
