name: Check CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-biome:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Print node and npx version
        run: node --version && npx --version

      - name: Check with Biome
        run: npx --yes @biomejs/biome@2.6.9 ci --reporter=github

  check-clang-format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Print clang-format-21 version
        run: clang-format-21 --version

      - name: Check with clang-format
        shell: bash --noprofile --norc -euo pipefail {0}
        run: git ls-files -z -- '*.c' '*.h' '*.cpp' '*.hpp' | xargs -0 clang-format-21 --dry-run --Werror

  check-editorconfig:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Print pipx version
        run: pipx --version && "$(pipx environment --value PIPX_DEFAULT_PYTHON)" --version

      - name: Check with editorconfig-checker
        run: pipx run 'editorconfig-checker==3.11.1' -format github-actions -exclude '\.(c|h|cpp|hpp|md)$'

  check-gersemi:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Print pipx and python3 version
        run: pipx --version && "$(pipx environment --value PIPX_DEFAULT_PYTHON)" --version

      - name: Check with gersemi
        run: pipx run 'gersemi==0.27.7' --check --diff CMakeLists.txt src tests

  check-reuse:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Print pipx and python3 version
        run: pipx --version && "$(pipx environment --value PIPX_DEFAULT_PYTHON)" --version

      - name: Check with REUSE
        run: pipx run 'reuse[charset-normalizer]==6.2.0' lint

  accept-check-ci:
    if: always()
    needs:
      - check-biome
      - check-clang-format
      - check-editorconfig
      - check-gersemi
      - check-reuse
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: All the checks MUST succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -ne '$ENV.NEEDS | fromjson | all(.result == "success")'
