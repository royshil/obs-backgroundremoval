name: Check CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-clang-format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check with clang-format
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          clang-format-21 --version
          git ls-files -z '*.c' '*.cpp' '*.h' '*.hpp' '*.m' '*.mm' ':!vendor/' | xargs -0 clang-format-21 --dry-run --Werror

  check-gersemi:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gersemi
        run: /home/linuxbrew/.linuxbrew/bin/brew install gersemi

      - name: Check with gersemi
        run: /home/linuxbrew/.linuxbrew/bin/gersemi . --check --diff

  check-editorconfig-checker:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install editorconfig
        run: /home/linuxbrew/.linuxbrew/bin/brew install editorconfig-checker

      - name: Check with editorconfig-checker
        run: /home/linuxbrew/.linuxbrew/bin/editorconfig-checker -exclude editorconfig-checker -exclude '\.(cpp|hpp|c|h|m|mm)$' -format github-actions

  check-reuse:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install check requirements
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: python -m pip install 'reuse[charset-normalizer]==6.2.0'

      - name: Lint with REUSE
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: bin/check reuse

  accept-check-ci:
    if: always()
    needs:
      - check-clang-format
      - check-gersemi
      - check-editorconfig-checker
      - check-reuse
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check workflow results
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: jq -e 'all(.[]; .result == "success")' <<< "${NEEDS:?}"
