name: Check CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-clang-format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Print clang-format version
        run: clang-format --version

      - name: Check with clang-format
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: git ls-files :/{src,tests}'/*.'{cpp,hpp,c,h,m,mm} | xargs clang-format --dry-run --Werror

  check-gersemi:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check with gersemi
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: pipx run --python 3.14 'gersemi==0.29.2' $(git ls-files ':/CMakeLists.txt' ':/cmake/*.cmake' ':/src/*CMakeLists.txt' ':/tests/*CMakeLists.txt') --check

  check-reuse:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check with REUSE
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: pipx run --python 3.14 'reuse[charset-normalizer]==6.3.0' lint

  accept-check-ci:
    if: always()
    needs:
      - check-clang-format
      - check-gersemi
      - check-reuse
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check workflow results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -ne '$ENV.NEEDS | fromjson | all(.[]; .result == "success")'
