name: Check CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-clang-format:
    name: Check clang-format

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install clang-format with Linuxbrew
        shell: bash
        env:
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install obsproject/tools/clang-format@19
          echo "$(brew --prefix obsproject/tools/clang-format@19)/bin" >> "$GITHUB_PATH"

      - name: Check with clang-format
        shell: bash
        run: |
          set -euo pipefail
          git ls-files "*.c" "*.cpp" "*.h" "*.hpp" | xargs --no-run-if-empty clang-format-19 --dry-run --Werror

  check-gersemi:
    name: Check gersemi

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install gersemi with Linuxbrew
        shell: bash
        env:
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install obsproject/tools/gersemi
          echo "$(brew --prefix obsproject/tools/gersemi)/bin" >> "$GITHUB_PATH"

      - name: Check with gersemi
        shell: bash
        run: |
          set -euo pipefail
          git ls-files CMakeLists.txt "*.cmake" | xargs --no-run-if-empty gersemi --check

  check-reuse:
    name: Check reuse

    runs-on: ubuntu-slim
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python for REUSE
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          pip-install: reuse

      - name: Lint with REUSE
        shell: bash
        run: reuse lint
