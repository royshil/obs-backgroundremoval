name: Assert git checkout
description: Assert that a Git working tree is at the expected commit.

inputs:
  path:
    description: Git working tree to inspect.
    required: true
  git-commit:
    description: Expected Git commit hash.
    required: true

runs:
  using: composite
  steps:
    - name: Assert git commit
      shell: pwsh -command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
      working-directory: ${{ inputs.path }}
      env:
        EXPECTED_GIT_COMMIT: ${{ inputs.git-commit }}
      run: |
        $actualGitCommit = git rev-parse HEAD
        if ($LASTEXITCODE -ne 0) {
          throw 'Failed to determine the current Git commit.'
        }

        if ($actualGitCommit -ne $env:EXPECTED_GIT_COMMIT) {
          throw "Git commit does not match: expected $env:EXPECTED_GIT_COMMIT, actual $actualGitCommit"
        }
